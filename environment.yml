# Varun's lane (CCTV / dashboard / API). Conda is optional here — a plain
# venv works too (see README "Run the demo" / tools/fixtures setup):
#   python3.12 -m venv .venv && .venv/bin/pip install -r <(python -c "...")
# This file exists so `conda env create -f environment.yml` also works.
name: bkk-flood-poc
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - fastapi~=0.142
      - uvicorn[standard]~=0.54
      - httpx~=0.28
      - respx~=0.23
      - apscheduler~=3.11
      - pillow~=12.3
      - imagehash~=4.3
      - opencv-python-headless~=5.0
      - open_clip_torch~=3.3
      - torch~=2.14
      - scikit-learn~=1.9
      - duckdb~=1.5
      - geopandas~=1.2
      - shapely~=2.2
      - pyarrow~=25.0
      - rioxarray~=0.23
      - rasterio~=1.5
      - pyproj~=3.8
      - xarray~=2026.9
      - netcdf4~=1.7
      - pyyaml~=6.0
      - jsonschema~=4.26
      - pytest~=9.1
